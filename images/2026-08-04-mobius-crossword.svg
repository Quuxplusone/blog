<text font-family="sans-serif" font-size="6">
  <tspan x="10" y="5" font-weight="bold">Across</tspan>
  <tspan x="10" dy="8">1. Honoree of a day in June</tspan>
  <tspan x="10" dy="8">2. Guitar effect heard in “The Crying Game”</tspan>
  <tspan x="10" dy="8">3. “A likely story!”</tspan>
  <tspan x="10" dy="8">4. Tie the knot</tspan>
  <tspan x="10" dy="8">5. Some is great?</tspan>
  <tspan x="10" dy="8">6. He deposed Milton</tspan>
  <tspan x="10" dy="8">7. Humphrey’s </tspan><tspan font-style="italic">High Sierra</tspan><tspan> costar</tspan>
  <tspan x="10" dy="8">8. Bev on a hot day</tspan>
  <tspan x="10" dy="8">9. Noted border-redrawer</tspan>
  <tspan x="10" dy="8">10. Half ass production?</tspan>
  <tspan x="130" y="94" font-weight="bold">Down</tspan>
  <tspan x="130" dy="8">1. Half a Camptown refrain</tspan>
  <tspan x="130" dy="8">2. Gum unit, sometimes</tspan>
  <tspan x="130" dy="8">3. Sound of an escaping giggle</tspan>
  <tspan x="130" dy="8">4. Wilfred Owen’s war</tspan>
  <tspan x="130" dy="8">5. Nabokov novel of 1969</tspan>
  <tspan x="130" dy="8">6. Salt’s suffix</tspan>
  <tspan x="130" dy="8">7. Former strongman Amin</tspan>
  <tspan x="130" dy="8">8. Sublime emotion</tspan>
  <tspan x="130" dy="8">9. Hitch one’s fate to</tspan>
  <tspan x="130" dy="8">10. Derisive mutter</tspan>
</text>
